<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ajjaram Brass Sources — Products</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#30251d;font-family:Arial,Helvetica,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}nav{height:65px;background:#fff;border-bottom:1px solid #eee7dd;display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:12px;position:sticky;top:0;z-index:10}.brand{font-size:19px;font-weight:700;color:#986b32}.upload-btn,.save-btn,.retry{border:0;border-radius:9px;background:#986b32;color:#fff;font-weight:700}.upload-btn{min-width:124px;padding:11px 14px;white-space:nowrap}.upload-btn:disabled,.save-btn:disabled{opacity:.65;cursor:wait}main{max-width:1450px;margin:auto;padding:24px 24px 55px}.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}.topline h1{font-size:20px;margin:0}.count{font-size:13px;color:#786e62}.message{display:none;margin:0 0 16px;padding:12px;border-radius:8px;background:#fff0f0;color:#a42a2a;font-size:13px;overflow-wrap:anywhere}.message.show{display:block}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid #eae3d8;border-radius:13px;overflow:hidden;min-width:0;box-shadow:0 2px 12px #2d211209}.photo{aspect-ratio:1;background:#f2eee7;display:flex;align-items:center;justify-content:center;position:relative;cursor:zoom-in}.photo img{width:100%;height:100%;object-fit:contain;display:block}.photo .placeholder{color:#aa9d8d;font-size:13px}.card-content{padding:13px;min-width:0}.field{margin-bottom:10px;min-width:0}.field label{display:block;font-size:11px;font-weight:700;color:#70665a;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;min-width:0;border:1px solid #e4ded4;background:#fff;border-radius:7px;padding:9px 8px;font-size:13px;color:#30251d;outline:none}.field textarea{resize:vertical;min-height:62px}.field :is(input,textarea,select):focus{border-color:#986b32}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.three input{padding:9px 5px}.save-btn{width:100%;padding:11px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px}.status{font-size:11px;min-height:18px;text-align:center;margin-top:7px;color:#4c7755;overflow-wrap:anywhere}.status.error{color:#b12e2e}.spinner{display:inline-block;width:15px;height:15px;border:2px solid #ffffff80;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}.loading-ring{width:28px;height:28px;border:3px solid #e5d7c2;border-top-color:#986b32;border-radius:50%;animation:spin .8s linear infinite;margin:25px auto}.loading-area{text-align:center;padding:6px}.empty{text-align:center;color:#85786a;padding:60px 10px}.retry{padding:9px 16px;margin:12px auto}.viewer{position:fixed;inset:0;background:#0e0e0ef5;z-index:100;display:flex;align-items:center;justify-content:center;padding:55px 14px 20px}.viewer[hidden]{display:none}.viewer img{max-width:100%;max-height:100%;object-fit:contain}.viewer-back{position:absolute;top:15px;left:17px;width:42px;height:42px;background:#ffffff22;border:0;color:#fff;border-radius:50%;font-size:19px}.photo:focus-visible{outline:3px solid #986b32;outline-offset:-3px}[hidden]{display:none!important}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:1000px) and (min-width:701px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){nav{height:60px;padding:0 13px}.brand{font-size:15px}.upload-btn{min-width:108px;font-size:12px;padding:10px 9px}main{padding:16px 11px 35px}.grid{grid-template-columns:1fr;gap:12px}.card{display:grid;grid-template-columns:minmax(110px,38%) minmax(0,1fr);align-items:start}.photo{aspect-ratio:auto;position:sticky;top:72px;height:230px;margin:8px;border-radius:9px;overflow:hidden}.card-content{padding:10px 10px 10px 2px}.field{margin-bottom:8px}.field label{font-size:10px}.field input,.field textarea,.field select{font-size:16px;padding:8px 6px}.field textarea{min-height:55px}.two,.three{gap:5px}.three input{padding:8px 3px}.topline h1{font-size:17px}}
@media(max-width:370px){.brand{font-size:13px}.card{grid-template-columns:minmax(100px,36%) minmax(0,1fr)}.photo{height:205px}}
/* IMAGE ONLY — no photo box, background, border or frame */
.photo{background:transparent!important;border:0!important;border-radius:0!important;overflow:visible!important;aspect-ratio:auto!important;min-height:0!important;height:230px!important;padding:0!important}
.photo img{width:100%;height:100%;object-fit:contain;display:block}
@media(max-width:700px){.photo{height:210px!important;margin:8px 4px!important;position:sticky;top:72px}}
@media(max-width:370px){.photo{height:190px!important}}
.field label{color:#111111;font-weight:700}</style></head><body>
<nav><div class="brand">AJJARAM BRASS SOURCES</div><button id="uploadBtn" class="upload-btn" type="button">Upload Images</button><input id="fileInput" type="file" accept="image/*" multiple hidden></nav>
<main><div class="topline"><h1>Products</h1><span id="count" class="count"></span></div><div id="message" class="message" role="alert"></div><div id="grid" class="grid"></div><div class="loading-area" id="loadingArea"><div class="loading-ring"></div></div><div id="empty" class="empty" hidden>No products yet. Upload images to get started.</div><div id="sentinel" style="height:1px"></div></main>
<div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-label="Product image preview"><button class="viewer-back" id="viewerBack" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button><img id="viewerImage" alt="Product image"></div>
<script>
const SUPABASE_URL='https://mnxogqwxfbmcsacoeook.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_nf9OO8Iq9mNaznCd6K5pmQ_cBoDO59Q';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id),grid=$('grid'),fileInput=$('fileInput'),uploadBtn=$('uploadBtn'),loadingArea=$('loadingArea'),empty=$('empty'),count=$('count'),message=$('message');
const PAGE_SIZE=12;let offset=0,hasMore=true,loading=false,uploading=false,totalShown=0,totalProducts=null;const knownIds=new Set();const timers=new WeakMap();const saveStates=new WeakMap();
function errorBanner(text){message.textContent=text;message.classList.add('show')}
function clearError(){message.classList.remove('show');message.textContent=''}
function str(v){return v===null||v===undefined?'':String(v)}
function field(label,key,value,type='text',options){const wrap=document.createElement('div');wrap.className='field';const lab=document.createElement('label');lab.textContent=label;let input;if(options){input=document.createElement('select');for(const item of options){const opt=document.createElement('option');opt.value=item;opt.textContent=item||'Select';input.append(opt)}if(value&&!options.includes(value)){const opt=document.createElement('option');opt.value=value;opt.textContent=value;input.append(opt)}input.value=str(value)}else{input=type==='textarea'?document.createElement('textarea'):document.createElement('input');if(type!=='textarea')input.type=type;input.value=str(value);if(type==='number'){input.min='0';input.step='any'}}input.dataset.field=key;wrap.append(lab,input);return wrap}
function cardFor(p){const card=document.createElement('article');card.className='card';card.dataset.id=p.id;const photo=document.createElement('div');photo.className='photo';if(p.image1){const img=document.createElement('img');img.src=p.image1;img.alt=p.product_name||'Product';img.loading='lazy';photo.append(img);photo.tabIndex=0;photo.setAttribute('role','button');photo.setAttribute('aria-label','View full image');photo.onclick=()=>openViewer(p.image1);photo.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openViewer(p.image1)}}}else{const label=document.createElement('span');label.className='placeholder';label.textContent='No image';photo.append(label)}
const body=document.createElement('div');body.className='card-content';body.append(field('Product Name ('+p.id+')','product_name',p.product_name),field('Price (₹)','price',p.price,'number'));const pair=document.createElement('div');pair.className='two';pair.append(field('Color','color',p.color,'text',['','Gold','Brown']),field('Material','material',p.material,'text',['','Copper','Silver','Brass']));body.append(pair,field('Description','description',p.description,'textarea'));const m=p.measurments&&typeof p.measurments==='object'?p.measurments:{};const triple=document.createElement('div');triple.className='three';triple.append(field('Height (cm)','height',m.height,'number'),field('Width (cm)','width',m.width,'number'),field('Weight (kg)','weight',m.weight,'number'));body.append(triple);const button=document.createElement('button');button.className='save-btn';button.type='button';button.textContent='Save Details';const status=document.createElement('div');status.className='status';status.setAttribute('role','status');button.onclick=()=>{clearTimeout(timers.get(card));saveCard(card,true)};body.append(button,status);card.append(photo,body);
body.querySelectorAll('input,textarea,select').forEach(el=>{const event=el.tagName==='SELECT'?'change':'input';el.addEventListener(event,()=>{card.dataset.dirty='1';status.textContent='Unsaved changes';status.className='status';clearTimeout(timers.get(card));timers.set(card,setTimeout(()=>saveCard(card,false),850))})});return card}
function value(card,key){return card.querySelector('[data-field="'+key+'"]').value.trim()}
function numberOrNull(v){return v===''?null:Number(v)}
function payloadFor(card){const price=numberOrNull(value(card,'price'));const height=numberOrNull(value(card,'height')),width=numberOrNull(value(card,'width')),weight=numberOrNull(value(card,'weight'));if([price,height,width,weight].some(n=>n!==null&&(!Number.isFinite(n)||n<0)))throw Error('Enter valid non-negative numbers');return{product_name:value(card,'product_name')||null,price,color:value(card,'color')||null,material:value(card,'material')||null,description:value(card,'description')||null,measurments:{height,width,weight}}}
async function saveCard(card,manual){const status=card.querySelector('.status'),button=card.querySelector('.save-btn');let state=saveStates.get(card);if(!state){state={busy:false,version:0};saveStates.set(card,state)}if(state.busy){state.pending=true;return}let payload;try{payload=payloadFor(card)}catch(e){status.textContent=e.message;status.className='status error';return}state.busy=true;state.pending=false;const snapshot=JSON.stringify(payload);button.disabled=true;button.innerHTML='<span class="spinner"></span> Saving';status.textContent='Saving...';status.className='status';try{const {data,error}=await db.from('products').update(payload).eq('id',card.dataset.id).select('id');if(error)throw error;if(!data||!data.length)throw Error('Update blocked: check Supabase UPDATE and SELECT RLS policies');const latest=JSON.stringify(payloadFor(card));if(latest===snapshot){card.dataset.dirty='';status.textContent='✓ Saved';button.textContent='✓ Saved'}else{state.pending=true;status.textContent='Saving latest changes...';button.textContent='Save Details'}}catch(e){status.textContent=e.message||'Save failed';status.className='status error';button.textContent='Save Details'}finally{button.disabled=false;state.busy=false;if(state.pending){state.pending=false;clearTimeout(timers.get(card));timers.set(card,setTimeout(()=>saveCard(card,false),150))}else{setTimeout(()=>{if(!state.busy&&button.textContent==='✓ Saved')button.textContent='Save Details'},1600)}}}
function updateCount(){count.textContent=totalShown+' loaded'+(totalProducts===null?'':' · '+totalProducts+' total products')}
async function fetchTotal(){const {count:total,error}=await db.from('products').select('id',{count:'exact',head:true});if(!error){totalProducts=total;updateCount()}}
fetchTotal();
function addCard(p,prepend=false){if(knownIds.has(String(p.id)))return;knownIds.add(String(p.id));const card=cardFor(p);if(prepend)grid.prepend(card);else grid.append(card);totalShown++;updateCount();empty.hidden=true}
async function loadMore(){if(loading||!hasMore||uploading)return;loading=true;loadingArea.hidden=false;try{const {data,error}=await db.from('products').select('id,product_name,price,image1,color,material,description,measurments').order('id',{ascending:false}).range(offset,offset+PAGE_SIZE-1);if(error)throw error;for(const p of data||[])addCard(p);offset+=(data||[]).length;hasMore=(data||[]).length===PAGE_SIZE;if(!totalShown&&!hasMore)empty.hidden=false;clearError()}catch(e){errorBanner('Products load failed: '+e.message+' — Check SELECT policy and browser console.');hasMore=false;const retry=document.createElement('button');retry.className='retry';retry.textContent='Retry Loading';retry.onclick=()=>{retry.remove();hasMore=true;loadMore()};message.append(document.createTextNode(' '),retry)}finally{loading=false;loadingArea.hidden=true;if(hasMore&&$('sentinel').getBoundingClientRect().top<window.innerHeight+300)setTimeout(loadMore,50)}}
const observer=new IntersectionObserver(entries=>{if(entries.some(x=>x.isIntersecting))loadMore()},{rootMargin:'400px'});observer.observe($('sentinel'));loadMore();
function openViewer(src){$('viewerImage').src=src;$('viewer').hidden=false;document.body.style.overflow='hidden'}function closeViewer(){$('viewer').hidden=true;$('viewerImage').removeAttribute('src');document.body.style.overflow=''}$('viewerBack').onclick=closeViewer;$('viewer').onclick=e=>{if(e.target===$('viewer'))closeViewer()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('viewer').hidden)closeViewer()});
uploadBtn.onclick=()=>fileInput.click();fileInput.onchange=async()=>{const files=[...fileInput.files];fileInput.value='';if(!files.length)return;if(files.length>5){errorBanner('Maximum 5 images at a time');return}if(files.some(f=>!f.type.startsWith('image/'))){errorBanner('Only images are allowed');return}clearError();uploading=true;uploadBtn.disabled=true;let succeeded=0;const errors=[];for(let i=0;i<files.length;i++){const f=files[i];uploadBtn.innerHTML='<span class="spinner"></span> '+(i+1)+'/'+files.length;let path=null;try{const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';path='products/'+Date.now()+'-'+crypto.randomUUID()+'.'+ext;const {error:uploadError}=await db.storage.from('productimages').upload(path,f,{contentType:f.type,upsert:false});if(uploadError)throw uploadError;const {data:url}=db.storage.from('productimages').getPublicUrl(path);const {data:created,error:insertError}=await db.from('products').insert({image1:url.publicUrl}).select('id,product_name,price,image1,color,material,description,measurments').single();if(insertError)throw insertError;addCard(created,true);succeeded++;offset++;if(totalProducts!==null){totalProducts++;updateCount()}}catch(e){errors.push('Image '+(i+1)+': '+e.message);if(path){/* Storage object may remain if DB insert failed; avoid deleting it without verifying ownership. */}}}uploading=false;uploadBtn.disabled=false;if(errors.length){uploadBtn.textContent='Upload Images';errorBanner(errors.join(' | '))}else{uploadBtn.innerHTML='<i class="fa-solid fa-check"></i>';setTimeout(()=>{uploadBtn.textContent='Upload Images'},1700)}if(hasMore&&$('sentinel').getBoundingClientRect().top<window.innerHeight+400)loadMore()};
</script></body></html>
